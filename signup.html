<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Join NyumbaHub</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.9)),
        url('daniel-barnes-RKdLlTyjm5g-unsplash.jpg') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
    }

    /* CONTAINER */
    .signup-container {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(30px);
      padding: 45px 40px;
      border-radius: 20px;
      width: 95%;
      max-width: 460px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      animation: floatUp 1s ease;
    }

    /* TITLE */
    .signup-container h1 {
      font-size: 2.3rem;
      color: #ffb400;
      text-align: center;
    }

    .tagline {
      text-align: center;
      font-size: 0.9rem;
      margin-top: 5px;
      color: rgba(255, 255, 255, 0.8);
    }

    /* TRUST BADGES */
    .trust {
      display: flex;
      justify-content: space-between;
      margin: 15px 0 25px;
      font-size: 0.75rem;
      opacity: 0.8;
    }

    .trust span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* FORM */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      font-size: 0.85rem;
      color: #ccc;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      transition: 0.3s;
    }

    input:focus,
    select:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 10px #ffb400;
      transform: scale(1.02);
    }

    /* BUTTON */
    .signup-btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(90deg, #ffb400, #ffd76a);
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    .signup-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 180, 0, 0.5);
    }

    /* LOGIN */
    .login-link {
      text-align: center;
      margin-top: 20px;
    }

    .login-link a {
      color: #ffb400;
    }

    /* ANIMATION */
    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="signup-container">

    <h1>NyumbaHub</h1>
    <p class="tagline">List. Find. Move Smarter.</p>

    <div class="trust">
      <span>🔒 Secure</span>
      <span>✔ Verified</span>
      <span>⚡ Fast Listings</span>
    </div>

    <form id="signupForm">

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="form-group">
        <label>Phone (M-Pesa Ready)</label>
        <input type="text" id="phone" placeholder="2547XXXXXXXX" required />
      </div>

      <div class="form-group">
        <label>Account Type</label>
        <select id="role" required>
          <option value="">Select role</option>
          <option value="tenant">Tenant</option>
          <option value="landlord">Landlord</option>
        </select>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required />
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" required />
      </div>

      <button class="signup-btn">Create Account</button>

    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Login</a>
    </div>

  </div>

</body>

</html>
