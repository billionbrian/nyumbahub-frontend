<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Management | NyumbaHub</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles/global-ui.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Hero Section */
    .listing-hero {
      text-align: center;
      padding: 40px 20px 20px;
      max-width: 820px;
      margin: 0 auto;
    }

    .listing-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 180, 0, 0.14);
      color: var(--brand-primary);
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 180, 0, 0.28);
    }

    .listing-hero h1 {
      font-size: clamp(1.85rem, 5vw, 2.75rem);
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .listing-hero h1 span {
      color: var(--brand-primary);
    }

    .listing-hero p {
      font-size: clamp(0.95rem, 2.2vw, 1.05rem);
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Form Container */
    .listing-wrapper {
      max-width: 860px;
      width: 100%;
      margin: 0 auto 64px;
      padding: 0 16px;
    }

    .listing-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: var(--shadow-medium);
      padding: 36px 32px;
    }

    .form-section-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-section-title:first-of-type {
      margin-top: 0;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-grid-2 .form-group {
      margin-bottom: 0;
    }

    .form-group label {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--input-border);
      border-radius: 10px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      color-scheme: light dark;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(255, 180, 0, 0.15);
    }

    .form-group textarea {
      min-height: 110px;
      resize: vertical;
    }

    /* Location Picker Styling */
    .location-picker-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .picker-instruction {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .location-search-toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .location-search-wrapper {
      flex: 1;
      min-width: 220px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .location-search-wrapper input {
      width: 100%;
      padding: 10px 42px 10px 36px;
      border: 1.5px solid var(--input-border);
      border-radius: 999px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.88rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .location-search-wrapper input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(255, 180, 0, 0.15);
    }

    .loc-search-icon {
      position: absolute;
      left: 12px;
      color: var(--text-secondary);
      pointer-events: none;
      display: flex;
    }

    .btn-search-exec {
      position: absolute;
      right: 4px;
      padding: 6px 12px;
      background: var(--brand-primary);
      border: none;
      border-radius: 999px;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: opacity 0.2s;
    }

    .btn-search-exec:hover {
      opacity: 0.88;
    }

    .btn-gps-locator {
      padding: 10px 16px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .btn-gps-locator:hover {
      border-color: var(--brand-primary);
      background: var(--border-color);
    }

    .picker-layer-switcher {
      display: flex;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .picker-layer-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .picker-layer-btn:hover {
      color: var(--text-primary);
    }

    .picker-layer-btn.active {
      background: var(--brand-primary);
      color: #111827;
    }

    .gps-feedback-bar {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      margin-bottom: 10px;
      display: none;
      line-height: 1.4;
    }

    .gps-feedback-bar.info {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      color: #3b82f6;
    }

    .gps-feedback-bar.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #ef4444;
    }

    .location-canvas {
      height: 320px;
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      position: relative;
      z-index: 1;
      margin-bottom: 12px;
    }

    /* Selected location readout card */
    .location-status-card {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-summary {
      flex: 1;
      min-width: 200px;
    }

    .status-title {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 2px;
    }

    .status-address {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .status-meta {
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .status-meta span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-confirm-coords {
      padding: 10px 18px;
      background: var(--brand-primary);
      color: #000;
      font-weight: 700;
      font-size: 0.88rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-confirm-coords:disabled {
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      cursor: not-allowed;
      border: 1px solid var(--border-color);
    }

    .btn-confirm-coords:not(:disabled):hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .confirmed-pill {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Submit Button */
    .form-submit-btn {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-hover));
      color: #111827;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      cursor: pointer;
      margin-top: 20px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 14px rgba(255, 180, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .form-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 180, 0, 0.45);
    }

    /* Auth Prompt States */
    .auth-prompt-card {
      text-align: center;
      padding: 48px 24px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
    }

    .auth-prompt-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: rgba(255, 180, 0, 0.12);
      color: var(--brand-primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 180, 0, 0.25);
    }

    .auth-prompt-card h3 {
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .auth-prompt-card p {
      font-size: 0.95rem;
      color: var(--text-secondary);
      max-width: 480px;
      margin: 0 auto 24px;
      line-height: 1.6;
    }

    .auth-prompt-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-hover));
      color: #111827;
      font-weight: 700;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      box-shadow: 0 4px 14px rgba(255, 180, 0, 0.35);
      transition: all 0.25s ease;
    }

    .auth-prompt-btn:hover {
      transform: translateY(-2px);
    }

    @media (max-width: 768px) {
      .listing-hero {
        padding: 24px 14px 12px;
      }

      .listing-card {
        padding: 24px 16px;
      }

      .form-grid-2 {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .location-search-toolbar {
        flex-direction: column;
      }

      .location-status-card {
        flex-direction: column;
        align-items: stretch;
      }

      .btn-confirm-coords {
        justify-content: center;
      }
    }
  </style>
</head>

<body hx-ext="head-support">
  <div id="navbar"></div>

  <div id="content-swap" class="content-swap" data-page="add-property" hx-target="#content-swap" hx-select="#content-swap" hx-swap="outerHTML show:window:top" hx-push-url="true">
    <main>
      <section class="listing-hero">
        <div class="listing-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span id="heroPortalBadge">Landlord & Host Portal</span>
        </div>
        <h1 id="heroTitle">List Your <span>Property</span></h1>
        <p id="heroSubtitle">Connect with thousands of students and verified tenants seeking verified accommodations.</p>
      </section>

      <div class="listing-wrapper">
        <div class="listing-card">
          <div id="propertyFormContainer">
            <!-- Dynamically verified and rendered based on auth -->
            <div style="text-align:center; padding: 4rem 1rem; color: var(--text-secondary);">
              <div style="display:inline-block; width:30px; height:30px; border:3px solid var(--border-color); border-top-color:var(--brand-primary); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:14px;"></div>
              <p style="font-size:0.95rem; font-weight:500;">Verifying Landlord Account...</p>
              <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>

    <script>
    (function() {
      function getApiBase() {
        if (window.location.protocol.startsWith('http') && !['5500', '3000', '5173'].includes(window.location.port)) {
          return window.location.origin;
        }
        return 'http://localhost:8080';
      }

      async function initAddPropertyPage() {
        const container = document.getElementById('propertyFormContainer');
        if (!container) return;

        const token = typeof getToken === 'function' ? getToken() : localStorage.getItem('token');
        if (!token) {
          container.innerHTML = `
            <div class="auth-prompt-card">
              <span class="auth-prompt-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <h3>Host Authentication Required</h3>
              <p>Please sign in with your Landlord account to publish listings, manage vacancies, and view tenant inquiries.</p>
              <a href="login.html" hx-get="login.html" class="auth-prompt-btn">Sign In to Continue →</a>
            </div>
          `;
          return;
        }

        // Show verifying spinner while checking with /api/auth/me/
        container.innerHTML = `
          <div style="text-align:center; padding: 4rem 1rem; color: var(--text-secondary);">
            <div style="display:inline-block; width:30px; height:30px; border:3px solid var(--border-color); border-top-color:var(--brand-primary); border-radius:50%; animation:spin 0.8s linear infinite; margin-bottom:14px;"></div>
            <p style="font-size:0.95rem; font-weight:500;">Verifying Landlord Account...</p>
            <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
          </div>
        `;

        let user = typeof getUserData === 'function' ? getUserData() : JSON.parse(localStorage.getItem('user') || 'null');

        try {
          const res = await fetch(`${getApiBase()}/api/auth/me/`, {
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });
          if (res.ok) {
            user = await res.json();
            if (typeof setUserData === 'function') setUserData(user);
            else localStorage.setItem('user', JSON.stringify(user));
          } else if (res.status === 401) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            container.innerHTML = `
              <div class="auth-prompt-card">
                <span class="auth-prompt-icon">
                  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </span>
                <h3>Session Expired</h3>
                <p>Your session has expired. Please sign in again with your Landlord account.</p>
                <a href="login.html" hx-get="login.html" class="auth-prompt-btn">Sign In →</a>
              </div>
            `;
            return;
          }
        } catch (e) {
          console.warn('Network auth check failed, using local user data if available:', e);
        }

        if (!user) {
          container.innerHTML = `
            <div class="auth-prompt-card">
              <span class="auth-prompt-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <h3>Host Authentication Required</h3>
              <p>Please sign in with your Landlord account to publish listings and manage your property portfolio.</p>
              <a href="login.html" hx-get="login.html" class="auth-prompt-btn">Sign In to Continue →</a>
            </div>
          `;
          return;
        }

        if (user.role !== 'landlord' && !user.is_staff && !user.is_superuser) {
          container.innerHTML = `
            <div class="auth-prompt-card">
              <span class="auth-prompt-icon">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
              </span>
              <h3>Tenant Account Detected</h3>
              <p>You are signed in as <strong>@${user.username}</strong> (${user.email || 'Student/Tenant'}). Only registered Landlord accounts can list properties on NyumbaHub.</p>
              <div style="display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap;">
                <a href="signup.html" hx-get="signup.html" class="auth-prompt-btn">Register as Landlord →</a>
                <button type="button" class="auth-prompt-btn" style="background:var(--bg-tertiary); color:var(--text-primary); border:1px solid var(--border-color); cursor:pointer;" onclick="localStorage.removeItem('token'); localStorage.removeItem('user'); window.location.href='login.html';">Switch Account / Sign In</button>
              </div>
            </div>
          `;
          return;
        }

        // Check URL parameters for edit mode
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id') || urlParams.get('edit');
        const isEditMode = !!editId;

        if (isEditMode) {
          const heroTitle = document.getElementById('heroTitle');
          const heroSubtitle = document.getElementById('heroSubtitle');
          if (heroTitle) heroTitle.innerHTML = 'Update <span>Property</span>';
          if (heroSubtitle) heroSubtitle.textContent = 'Modify listing details, adjust rent, or update your pin location.';
        }

        renderForm(isEditMode, editId);
      }

      function renderForm(isEditMode, editId) {
        const container = document.getElementById('propertyFormContainer');
        container.innerHTML = `
          <form id="propertyEntryForm">
            <!-- 1. Basic Information -->
            <div class="form-section-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              <span>Basic Information</span>
            </div>

            <div class="form-group">
              <label for="propTitle">Property Listing Title *</label>
              <input type="text" id="propTitle" name="title" required placeholder="e.g. Modern Executive Bedsitter near Campus" />
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label for="propType">Property Type *</label>
                <select id="propType" name="property_type" required>
                  <option value="bedsitter">Bedsitter</option>
                  <option value="single">Single Room</option>
                  <option value="one_bedroom">One Bedroom</option>
                  <option value="two_bedroom">Two Bedroom</option>
                  <option value="three_bedroom">Three Bedroom</option>
                  <option value="apartment">Full Apartment</option>
                  <option value="villa">Hostel / Villa</option>
                </select>
              </div>

              <div class="form-group">
                <label for="propStatus">Listing Status *</label>
                <select id="propStatus" name="status" required>
                  <option value="available">Available Now</option>
                  <option value="booked">Booked</option>
                  <option value="maintenance">Under Renovation</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="propDesc">Detailed Description *</label>
              <textarea id="propDesc" name="description" required placeholder="Describe amenities (WiFi, water security, backup power, proximity to campus, gate hours)..."></textarea>
            </div>

            <!-- Property Photos & Images -->
            <div class="form-section-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
              <span>Property Photos &amp; Media (Upload Multiple Images)</span>
            </div>

            <div class="image-uploader-box" style="margin-bottom:1.5rem; padding:1.25rem; border:2px dashed var(--border-color); border-radius:12px; background:var(--input-bg); text-align:center;">
              <input type="file" id="propImages" multiple accept="image/*" style="display:none;" onchange="handleImageSelection(this)" />
              <div style="cursor:pointer;" onclick="document.getElementById('propImages').click()">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--brand-primary)" stroke-width="1.8" style="margin-bottom:0.4rem; display:inline-block;">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                <p style="font-weight:600; font-size:0.95rem; margin-bottom:0.2rem; color:var(--text-primary);">Click here to select high-quality property photos</p>
                <p style="font-size:0.8rem; color:var(--text-secondary);">Select multiple photos (JPEG, PNG, WebP). First photo becomes the listing cover.</p>
              </div>
              <div id="imagePreviewContainer" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:10px; margin-top:1rem;"></div>
            </div>

            <!-- 2. Exact Location Picker -->
            <div class="form-section-title">

              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
              <span>Property Location &amp; Exact Pin *</span>
            </div>

            <div class="location-picker-box">
              <p class="picker-instruction">
                Search for an area, click anywhere on the map, or use your current location to place an exact marker. Drag the pin to adjust if necessary, then click <strong>Confirm Location</strong>.
              </p>

              <div class="location-search-toolbar">
                <div class="location-search-wrapper">
                  <span class="loc-search-icon">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                  </span>
                  <input type="text" id="mapSearchInput" placeholder="Search town, landmark, street, or campus..." autocomplete="off" />
                  <button type="button" id="btnExecSearch" class="btn-search-exec">Search</button>
                </div>
                <button type="button" id="btnGpsLocate" class="btn-gps-locator">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="22" y1="12" x2="18" y2="12"></line><line x1="6" y1="12" x2="2" y2="12"></line><line x1="12" y1="6" x2="12" y2="2"></line><line x1="12" y1="22" x2="12" y2="18"></line></svg>
                  <span>Use my current location</span>
                </button>
                <div class="picker-layer-switcher">
                  <button type="button" class="picker-layer-btn active" id="btnPickerStreet" title="Street Map">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                    <span>Map</span>
                  </button>
                  <button type="button" class="picker-layer-btn" id="btnPickerSatellite" title="Satellite View">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path><path d="M2 12h20"></path></svg>
                    <span>Satellite</span>
                  </button>
                </div>
              </div>

              <!-- Feedback message for Geolocation states -->
              <div id="gpsFeedback" class="gps-feedback-bar"></div>

              <!-- Map Viewport -->
              <div id="pickerMap" class="location-canvas"></div>

              <!-- Location Status & Confirmation Bar -->
              <div class="location-status-card">
                <div class="status-summary">
                  <div class="status-title">Selected Pin Location</div>
                  <div class="status-address" id="displayLocAddress">No location selected yet. Place a pin on the map.</div>
                  <div class="status-meta">
                    <span id="displayLatLon">Coordinates: None</span>
                    <span id="displayAccuracyBadge" style="display:none;"></span>
                  </div>
                </div>
                <div id="confirmActionWrap">
                  <button type="button" id="btnConfirmLocation" class="btn-confirm-coords" disabled>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    <span>Confirm Location</span>
                  </button>
                  <div id="confirmedPill" class="confirmed-pill" style="display:none;">
                    ✓ Location Confirmed
                  </div>
                </div>
              </div>
            </div>

            <!-- 3. Pricing & Specifications -->
            <div class="form-section-title">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="1" x2="12" y2="23"></line>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
              </svg>
              <span>Pricing &amp; Specifications</span>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label for="propRent">Monthly Rent (KES) *</label>
                <input type="number" id="propRent" name="rent_amount" required placeholder="e.g. 8000" min="500" step="100" />
              </div>

              <div class="form-group">
                <label for="propBedrooms">Bedrooms *</label>
                <input type="number" id="propBedrooms" name="bedrooms" required min="1" value="1" />
              </div>
            </div>

            <div class="form-grid-2">
              <div class="form-group">
                <label for="propBathrooms">Bathrooms *</label>
                <input type="number" id="propBathrooms" name="bathrooms" required min="1" value="1" />
              </div>

              <div class="form-group">
                <label>Authoritative Ownership</label>
                <input type="text" value="Assigned to your authenticated account" disabled style="background:var(--bg-tertiary); cursor:not-allowed;" />
              </div>
            </div>

            <button type="submit" class="form-submit-btn" id="btnSubmitForm">
              <span id="submitLabel">${isEditMode ? 'Update Property Listing' : 'Publish Property Listing'}</span>
              <span>→</span>
            </button>
          </form>
        `;

        initMapLogic(isEditMode, editId);
      }

      function initMapLogic(isEditMode, editId) {
        if (typeof L === 'undefined') {
          console.error('Leaflet library is not loaded');
          return;
        }

        // State
        let currentMarker = null;
        let selectedLat = null;
        let selectedLon = null;
        let confirmedLat = null;
        let confirmedLon = null;
        let isConfirmed = false;
        let gpsAccuracy = null;

        // Default map center: Kilifi / Coast region (-3.6305, 39.8499)
        const defaultCenter = [-3.6305, 39.8499];
        const map = L.map('pickerMap').setView(defaultCenter, 13);

        // Google Streets: Clean, modern, high-speed map with zero API keys required
        const streetLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
          maxZoom: 20,
          subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
          attribution: 'Map data © Google'
        }).addTo(map);

        // Google Satellite Hybrid: Crisp satellite photo imagery with roads and labels
        const satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
          maxZoom: 20,
          subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
          attribution: 'Imagery © Google'
        });

        const btnPickerStreet = document.getElementById('btnPickerStreet');
        const btnPickerSatellite = document.getElementById('btnPickerSatellite');

        if (btnPickerStreet && btnPickerSatellite) {
          btnPickerStreet.onclick = function() {
            if (map.hasLayer(satelliteLayer)) map.removeLayer(satelliteLayer);
            streetLayer.addTo(map);
            btnPickerStreet.classList.add('active');
            btnPickerSatellite.classList.remove('active');
          };
          btnPickerSatellite.onclick = function() {
            if (map.hasLayer(streetLayer)) map.removeLayer(streetLayer);
            satelliteLayer.addTo(map);
            btnPickerSatellite.classList.add('active');
            btnPickerStreet.classList.remove('active');
          };
        }

        // Elements
        const displayAddress = document.getElementById('displayLocAddress');
        const displayLatLon = document.getElementById('displayLatLon');
        const displayAccuracy = document.getElementById('displayAccuracyBadge');
        const btnConfirm = document.getElementById('btnConfirmLocation');
        const confirmedPill = document.getElementById('confirmedPill');
        const gpsFeedback = document.getElementById('gpsFeedback');
        const searchInput = document.getElementById('mapSearchInput');
        const btnSearch = document.getElementById('btnExecSearch');
        const btnGps = document.getElementById('btnGpsLocate');

        function setPinPosition(lat, lon, zoomTo=false, customAddress=null) {
          selectedLat = parseFloat(lat.toFixed(6));
          selectedLon = parseFloat(lon.toFixed(6));
          isConfirmed = false;

          // Update marker
          if (!currentMarker) {
            currentMarker = L.marker([selectedLat, selectedLon], { draggable: true }).addTo(map);
            currentMarker.on('dragend', function() {
              const pos = currentMarker.getLatLng();
              setPinPosition(pos.lat, pos.lng, false);
            });
          } else {
            currentMarker.setLatLng([selectedLat, selectedLon]);
          }

          if (zoomTo) {
            map.flyTo([selectedLat, selectedLon], Math.max(map.getZoom(), 16));
          }

          // UI readouts
          displayLatLon.textContent = `Coordinates: ${selectedLat}, ${selectedLon}`;
          btnConfirm.disabled = false;
          btnConfirm.style.display = 'inline-flex';
          confirmedPill.style.display = 'none';

          if (customAddress) {
            displayAddress.textContent = customAddress;
          } else {
            displayAddress.textContent = 'Reverse geocoding location...';
            reverseGeocodePreview(selectedLat, selectedLon);
          }
        }

        // Reverse geocode preview helper (via client request for instant feedback)
        async function reverseGeocodePreview(lat, lon) {
          try {
            // Try Photon first
            const res = await fetch(`https://photon.komoot.io/reverse?lat=${lat}&lon=${lon}`);
            if (res.ok) {
              const data = await res.json();
              if (data && data.features && data.features.length > 0) {
                const props = data.features[0].properties || {};
                const parts = [props.name, props.street, props.district, props.city || props.county, props.country].filter(Boolean);
                if (parts.length > 0) {
                  displayAddress.textContent = parts.slice(0, 3).join(', ');
                  return;
                }
              }
            }
          } catch (e) {}

          try {
            const res2 = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}`);
            if (res2.ok) {
              const data2 = await res2.json();
              if (data2 && data2.address) {
                const addr = data2.address;
                const parts = [
                  addr.neighbourhood || addr.suburb || addr.road,
                  addr.town || addr.city || addr.municipality,
                  addr.county,
                  addr.country
                ].filter(Boolean);
                displayAddress.textContent = parts.length ? parts.join(', ') : data2.display_name.split(',').slice(0, 3).join(', ');
                return;
              }
            }
          } catch (e2) {}

          displayAddress.textContent = `Location near ${lat.toFixed(4)}, ${lon.toFixed(4)}`;
        }

        // Map Click
        map.on('click', function(e) {
          setPinPosition(e.latlng.lat, e.latlng.lng, false);
        });

        // Search functionality
        async function doSearch() {
          const query = searchInput.value.trim();
          if (!query) return;

          btnSearch.textContent = '...';
          try {
            const res = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5`);
            if (res.ok) {
              const data = await res.json();
              if (data && data.features && data.features.length > 0) {
                const f = data.features[0];
                const lon = f.geometry.coordinates[0];
                const lat = f.geometry.coordinates[1];
                setPinPosition(lat, lon, true);
                gpsFeedback.style.display = 'none';
                btnSearch.textContent = 'Search';
                return;
              }
            }
          } catch (err) {}

          try {
            const res2 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            if (res2.ok) {
              const results = await res2.json();
              if (results && results.length > 0) {
                const first = results[0];
                const lat = parseFloat(first.lat);
                const lon = parseFloat(first.lon);
                setPinPosition(lat, lon, true);
                gpsFeedback.style.display = 'none';
                btnSearch.textContent = 'Search';
                return;
              }
            }
          } catch (err2) {}

          gpsFeedback.textContent = 'No matching places found. You can click anywhere on the map or drag the pin directly.';
          gpsFeedback.className = 'gps-feedback-bar';
          gpsFeedback.style.display = 'block';
          btnSearch.textContent = 'Search';
        }

        btnSearch.addEventListener('click', doSearch);
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            doSearch();
          }
        });

        // "Use My Current Location" functionality
        btnGps.addEventListener('click', function() {
          if (!navigator.geolocation) {
            gpsFeedback.textContent = 'Your browser does not support device location. Please place the property manually on the map.';
            gpsFeedback.className = 'gps-feedback-bar error';
            gpsFeedback.style.display = 'block';
            return;
          }

          gpsFeedback.textContent = 'Acquiring GPS location...';
          gpsFeedback.className = 'gps-feedback-bar info';
          gpsFeedback.style.display = 'block';

          navigator.geolocation.getCurrentPosition(
            function(position) {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              const accuracy = position.coords.accuracy;
              gpsAccuracy = accuracy;

              if (accuracy) {
                displayAccuracy.textContent = `Accuracy: ~${Math.round(accuracy)}m`;
                displayAccuracy.style.display = 'inline-block';
              }

              gpsFeedback.textContent = `Acquired location with ~${Math.round(accuracy || 0)}m accuracy. You can drag the pin to fine-tune.`;
              gpsFeedback.className = 'gps-feedback-bar info';
              gpsFeedback.style.display = 'block';

              setPinPosition(lat, lon, true);
            },
            function(err) {
              let msg = 'Your device could not determine its location. Try again or place the property manually.';
              if (err.code === err.PERMISSION_DENIED) {
                msg = 'Location permission was denied. You can place the property manually on the map.';
              } else if (err.code === err.POSITION_UNAVAILABLE) {
                msg = 'Your device could not determine its location. Try again or place the property manually.';
              } else if (err.code === err.TIMEOUT) {
                msg = 'Location request timed out. Try again or place the property manually.';
              }
              gpsFeedback.textContent = msg;
              gpsFeedback.className = 'gps-feedback-bar error';
              gpsFeedback.style.display = 'block';
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        });

        // "Confirm Location"
        btnConfirm.addEventListener('click', function() {
          if (selectedLat === null || selectedLon === null) return;
          confirmedLat = selectedLat;
          confirmedLon = selectedLon;
          isConfirmed = true;

          btnConfirm.style.display = 'none';
          confirmedPill.style.display = 'inline-flex';
          gpsFeedback.style.display = 'none';
        });

        // Preload property if in edit mode
        if (isEditMode) {
          loadPropertyForEdit(editId, setPinPosition, () => {
            confirmedLat = selectedLat;
            confirmedLon = selectedLon;
            isConfirmed = true;
            btnConfirm.style.display = 'none';
            confirmedPill.style.display = 'inline-flex';
          });
        }

        // Form submission handler
        const form = document.getElementById('propertyEntryForm');
        form.addEventListener('submit', async function(e) {
          e.preventDefault();

          if (!isConfirmed || confirmedLat === null || confirmedLon === null) {
            alert('Please select and confirm your property location on the map before publishing.');
            document.querySelector('.location-picker-box').scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
          }

          const token = typeof getToken === 'function' ? getToken() : localStorage.getItem('token');
          const submitBtn = document.getElementById('btnSubmitForm');
          submitBtn.disabled = true;
          submitBtn.innerHTML = `<span>Saving Listing...</span>`;

          const formData = new FormData();
          formData.append('title', document.getElementById('propTitle').value.trim());
          formData.append('description', document.getElementById('propDesc').value.trim());
          formData.append('property_type', document.getElementById('propType').value);
          formData.append('rent_amount', parseFloat(document.getElementById('propRent').value));
          formData.append('bedrooms', parseInt(document.getElementById('propBedrooms').value));
          formData.append('bathrooms', parseInt(document.getElementById('propBathrooms').value));
          formData.append('status', document.getElementById('propStatus').value);
          formData.append('available', document.getElementById('propStatus').value === 'available');
          if (confirmedLat !== null && confirmedLon !== null) {
            formData.append('latitude', confirmedLat);
            formData.append('longitude', confirmedLon);
          }
          // Append uploaded image files
          for (let file of selectedImageFiles) {
            formData.append('images', file);
          }

          try {
            const url = isEditMode
              ? `${getApiBase()}/api/properties/${editId}/`
              : `${getApiBase()}/api/properties/`;
            const method = isEditMode ? 'PATCH' : 'POST';

            const res = await fetch(url, {
              method: method,
              headers: {
                'Authorization': `Bearer ${token}`
              },
              body: formData
            });

            const data = await res.json();

            if (res.ok) {
              alert(isEditMode ? 'Property listing updated successfully!' : 'Property published successfully!');
              if (window.htmx) {
                window.htmx.ajax('GET', 'account.html', {
                  target: '#content-swap',
                  select: '#content-swap',
                  swap: 'outerHTML show:window:top',
                  pushUrl: true
                });
              } else {
                window.location.href = 'account.html';
              }
            } else {
              alert(`Action failed: ${JSON.stringify(data)}`);
              submitBtn.disabled = false;
              submitBtn.innerHTML = `<span>${isEditMode ? 'Update Property Listing' : 'Publish Property Listing'}</span><span>→</span>`;
            }
          } catch (err) {
            console.error('Error submitting property:', err);
            alert('Network error communicating with backend.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>${isEditMode ? 'Update Property Listing' : 'Publish Property Listing'}</span><span>→</span>`;
          }
        });
      }

      let selectedImageFiles = [];

      window.handleImageSelection = function(input) {
        const container = document.getElementById('imagePreviewContainer');
        if (!input.files || input.files.length === 0) return;
        for (let file of Array.from(input.files)) {
          selectedImageFiles.push(file);
          const reader = new FileReader();
          const currentIdx = selectedImageFiles.length - 1;
          reader.onload = (e) => {
            const thumb = document.createElement('div');
            thumb.style.cssText = 'position:relative; width:100%; height:80px; border-radius:8px; overflow:hidden; border:1px solid var(--border-color);';
            thumb.innerHTML = `
              <img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">
              <span style="position:absolute; top:3px; right:3px; background:rgba(0,0,0,0.7); color:#fff; border-radius:50%; width:18px; height:18px; font-size:11px; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="removeSelectedImage(${currentIdx}, this.parentElement)">&times;</span>
            `;
            container.appendChild(thumb);
          };
          reader.readAsDataURL(file);
        }
      };

      window.removeSelectedImage = function(index, element) {
        selectedImageFiles.splice(index, 1);
        if (element) element.remove();
      };

      async function loadPropertyForEdit(id, setPinFn, confirmCallback) {
        try {
          const res = await fetch(`${getApiBase()}/api/properties/${id}/`);
          if (res.ok) {
            const p = await res.json();
            document.getElementById('propTitle').value = p.title || '';
            document.getElementById('propDesc').value = p.description || '';
            document.getElementById('propRent').value = p.rent_amount || '';
            document.getElementById('propBedrooms').value = p.bedrooms || 1;
            document.getElementById('propBathrooms').value = p.bathrooms || 1;
            if (p.property_type) document.getElementById('propType').value = p.property_type;
            if (p.status) document.getElementById('propStatus').value = p.status;

            // Load existing images if any
            const container = document.getElementById('imagePreviewContainer');
            if (container && Array.isArray(p.images) && p.images.length > 0) {
              container.innerHTML = '';
              p.images.forEach(imgObj => {
                const u = imgObj.url || imgObj.image || imgObj.image_url;
                if (!u) return;
                const fullUrl = (u.startsWith('http') || u.startsWith('/')) ? u : `/${u}`;
                const thumb = document.createElement('div');
                thumb.style.cssText = 'position:relative; width:100%; height:80px; border-radius:8px; overflow:hidden; border:1px solid var(--border-color);';
                thumb.innerHTML = `<img src="${fullUrl}" style="width:100%; height:100%; object-fit:cover;">`;
                container.appendChild(thumb);
              });
            }

            if (p.latitude && p.longitude) {
              setPinFn(parseFloat(p.latitude), parseFloat(p.longitude), true, p.location);
              if (confirmCallback) confirmCallback();
            }
          } else {
            alert('Could not load property details for editing.');
          }
        } catch (e) {
          console.error('Failed to load property for edit:', e);
        }
      }


      window.PageInitializers = window.PageInitializers || {};
      window.PageInitializers['add-property'] = initAddPropertyPage;

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initAddPropertyPage);
      } else {
        initAddPropertyPage();
      }
    })();
  </script>
</div>
