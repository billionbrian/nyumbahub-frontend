<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NyumbaHub - Find Your Perfect Home</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>


  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Navbar -->
  <header class="navbar">
    <h1 class="logo">Nyumba<span>Hub</span></h1>
    <nav>
      <a href="index.html" class="active">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="gallery.html">Gallery</a>
      <a href="contact.html">Contact</a>
      <a href="login.html" class="login-btn">Login</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <h2>Find Your Perfect Home Faster</h2>
      <p>Connecting tenants and landlords easily, securely, and affordably. Discover thousands of listings across Kenya
        today.</p>

      <!-- Search Form -->
      <form id="searchForm" class="search-bar">
        <input type="text" id="location" placeholder="Enter location (e.g. Nairobi)" />
        <input type="number" id="price" placeholder="Max Price (KES)" />
        <select id="size">
          <option value="">Any Size</option>
          <option value="1">1 Bedroom</option>
          <option value="2">2 Bedrooms</option>
          <option value="3">3 Bedrooms</option>
          <option value="4">4+ Bedrooms</option>
        </select>
        <button type="submit">Search</button>
      </form>

      <button onclick="payWithMpesa('254712345678', 1000)" class="mpesa-btn">Pay with M-Pesa</button>
    </div>
  </section>

  <!-- Search Results -->
  <section class="results-section">
    <div id="results"></div>
    <div id="map"></div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 NyumbaHub. All rights reserved. | Designed with ❤️ in Kenya</p>
  </footer>

  <!-- JavaScript -->
  <script src="auth.js"></script>
  <script src="script.js"></script>
  <script>
    // Fetch properties from backend
    async function fetchProperties(filters = {}) {
      try {
        const token = localStorage.getItem('token');
        const headers = {
          'Content-Type': 'application/json',
        };
        
        if (token) {
          headers['Authorization'] = `Bearer ${token}`;
        }
        
        const params = new URLSearchParams(filters);
        const response = await fetch(`http://localhost:8000/api/properties/?${params.toString()}`, {
          headers: headers
        });
        
        if (response.ok) {
          const data = await response.json();
          return data.results || data;
        } else {
          console.error("Failed to fetch properties");
          return [];
        }
      } catch (error) {
        console.error("Error fetching properties:", error);
        return [];
      }
    }

    // Load properties on page load
    document.addEventListener('DOMContentLoaded', async () => {
      const houses = await fetchProperties();
      displayResults(houses);
    });

    // Override the search form handler from script.js
    const searchForm = document.getElementById("searchForm");
    const resultsDiv = document.getElementById("results");
    
    searchForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const location = document.getElementById("location").value;
      const price = document.getElementById("price").value;
      const size = document.getElementById("size").value;

      const filters = {};
      if (location) filters.location = location;
      if (price) filters.max_price = price;
      if (size) filters.bedrooms = size;

      const houses = await fetchProperties(filters);
      displayResults(houses);
    });

    function displayResults(list) {
      resultsDiv.innerHTML = "";
      if (list.length === 0) {
        resultsDiv.innerHTML = "<p class='no-results'>No houses found. Try adjusting filters.</p>";
        return;
      }

      list.forEach(property => {
        const card = document.createElement("div");
        card.classList.add("house-card");
        card.innerHTML = `
          <h3>${property.title || property.location || 'Property'}</h3>
          <p>Location: ${property.location || 'N/A'}</p>
          <p>Price: <strong>KES ${property.rent_amount ? property.rent_amount.toLocaleString() : 'N/A'}</strong></p>
          <p>Bedrooms: ${property.bedrooms || property.size || 'N/A'}</p>
          <p>Description: ${property.description || 'No description available'}</p>
        `;
        resultsDiv.appendChild(card);
      });
    }
  </script>
</body>

</html>
