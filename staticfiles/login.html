<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | NyumbaHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)),
        url('daniel-barnes-RKdLlTyjm5g-unsplash.jpg') center/cover no-repeat fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      color: #fff;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(25px);
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 420px;
      text-align: center;
      animation: floatUp 1.3s ease-out;
    }

    .login-container h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffb400;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .login-container p {
      font-size: 0.95rem;
      margin-bottom: 25px;
      color: rgba(255, 255, 255, 0.85);
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      color: #ddd;
    }

    input {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: 0.3s ease;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.03);
      box-shadow: 0 0 10px #ffb400;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #ffb400, #ffdd73);
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      color: #111;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 8px 20px rgba(255, 180, 0, 0.5);
    }

    .signup-link {
      margin-top: 20px;
      font-size: 0.95rem;
    }

    .signup-link a {
      color: #ffb400;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive tweaks */
    @media (max-width: 500px) {
      .login-container {
        padding: 30px 20px;
      }

      .login-container h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <h1>Welcome to NyumbaHub</h1>
    <p>Login to explore premium listings and manage your account.</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="signup-link">
      <p>Don't have an account? <a href="signup.html">Sign up here</a></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>

</html>
