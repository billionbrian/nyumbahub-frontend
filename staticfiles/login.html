<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | TapIn</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles/global-ui.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 180, 0, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.04) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-primary);
      overflow-x: hidden;
      transition: background-color 250ms ease, color 250ms ease;
    }

    [data-theme="dark"] body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 180, 0, 0.06) 0%, transparent 60%),
        radial-gradient(circle at 100% 100%, rgba(37, 99, 235, 0.03) 0%, transparent 50%);
    }

    main.auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 104px 20px 48px;
      width: 100%;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 8px 16px -4px rgba(15, 23, 42, 0.04);
      width: 100%;
      max-width: 460px;
      padding: 36px 34px;
      animation: floatUp 0.45s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] .auth-card {
      border-color: rgba(255, 255, 255, 0.12);
      box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    /* Switcher Tabs (Login / Register) */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-tertiary);
      padding: 5px;
      border-radius: 14px;
      margin-bottom: 26px;
      border: 1px solid var(--border-color);
    }

    .auth-tab {
      text-align: center;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }

    .auth-tab.active {
      background: var(--card-bg);
      color: #92400e;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    [data-theme="dark"] .auth-tab.active {
      color: var(--brand-primary);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }

    .auth-tab:hover:not(.active) {
      color: var(--text-primary);
    }

    /* Header */
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(255, 180, 0, 0.16);
      color: #92400e;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 12px;
      border: 1px solid rgba(217, 119, 6, 0.3);
    }

    [data-theme="dark"] .auth-badge {
      background: rgba(255, 180, 0, 0.12);
      color: var(--brand-primary);
      border-color: rgba(255, 180, 0, 0.28);
    }

    .auth-header h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.25;
      margin-bottom: 6px;
    }

    .auth-header h1 span {
      color: #b45309;
    }

    [data-theme="dark"] .auth-header h1 span {
      color: var(--brand-primary);
    }

    .auth-header p {
      font-size: 0.9rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    /* Inline Alert Message */
    .auth-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 18px;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }

    .auth-alert.error {
      display: flex;
      background: var(--danger-bg);
      color: var(--danger-color);
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .auth-alert.success {
      display: flex;
      background: var(--success-bg);
      color: var(--success-color);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    /* Form Controls */
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 7px;
      color: var(--text-primary);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .input-wrapper input {
      width: 100%;
      padding: 13px 44px 13px 42px;
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: #b45309;
      box-shadow: 0 0 0 4px rgba(255, 180, 0, 0.18);
    }

    [data-theme="dark"] .input-wrapper input:focus {
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 4px rgba(255, 180, 0, 0.2);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: color 0.2s ease;
    }

    .password-toggle:hover {
      color: #b45309;
    }

    [data-theme="dark"] .password-toggle:hover {
      color: var(--brand-primary);
    }

    .auth-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 20px;
      font-size: 0.84rem;
    }

    .remember-me {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      margin-bottom: 0;
      font-weight: 500;
    }

    .remember-me input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--brand-primary);
      padding: 0;
      cursor: pointer;
    }

    .forgot-link {
      color: #b45309;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-link:hover {
      color: #78350f;
      text-decoration: underline;
    }

    [data-theme="dark"] .forgot-link {
      color: var(--brand-primary);
    }

    [data-theme="dark"] .forgot-link:hover {
      color: var(--brand-hover);
    }

    /* Primary Submit Button (scoped so it never collides with navbar .login-btn) */
    .auth-submit-btn {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(90deg, var(--brand-primary), var(--brand-hover));
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      color: #111827;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(255, 180, 0, 0.3);
    }

    .auth-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(255, 180, 0, 0.45);
    }

    .auth-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Trust Pills */
    .auth-trust {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border-color);
      font-size: 0.76rem;
      color: var(--text-secondary);
    }

    .auth-trust span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .signup-link {
      margin-top: 18px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .signup-link a {
      color: #b45309;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .signup-link a:hover {
      color: #78350f;
      text-decoration: underline;
    }

    [data-theme="dark"] .signup-link a {
      color: var(--brand-primary);
    }

    [data-theme="dark"] .signup-link a:hover {
      color: var(--brand-hover);
    }

    @keyframes floatUp {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      main.auth-main {
        padding: 78px 14px 28px;
        align-items: flex-start;
      }

      .auth-card {
        padding: 26px 18px;
        border-radius: 20px;
      }

      .auth-header h1 {
        font-size: clamp(1.4rem, 5vw, 1.65rem);
      }

      .input-wrapper input {
        font-size: 16px;
      }
    }

    @media (max-width: 400px) {
      main.auth-main {
        padding: 72px 10px 24px;
      }

      .auth-card {
        padding: 20px 14px;
        border-radius: 16px;
      }

      .auth-options {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="navbar"></div>

  <main class="auth-main">
    <div class="auth-card">
      <!-- Quick Mode Switcher -->
      <div class="auth-tabs" role="tablist">
        <a href="login.html" class="auth-tab active" role="tab" aria-selected="true">Sign In</a>
        <a href="signup.html" class="auth-tab" role="tab" aria-selected="false">Create Account</a>
      </div>

      <div class="auth-header">
        <div class="auth-badge">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <span>Student & Landlord Portal</span>
        </div>
        <h1>Welcome to <span>TapIn</span></h1>
        <p>Sign in to browse verified campus housing, saved units, and tenancy agreements.</p>
      </div>

      <div id="authAlert" class="auth-alert" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="auth-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked />
            <span>Keep me signed in</span>
          </label>
          <a href="contact.html" class="forgot-link">Need help?</a>
        </div>

        <button type="submit" class="auth-submit-btn" id="loginSubmitBtn">
          <span>Sign In to TapIn</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>

      <div class="signup-link">
        Don't have an account yet? <a href="signup.html">Create a free account</a>
      </div>

      <div class="auth-trust">
        <span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          Verified Accommodations
        </span>
        <span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          Campus Commute Mapping
        </span>
        <span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          M-Pesa Integrated
        </span>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/layout.js"></script>
  <script src="theme.js"></script>
  <script>
    const EYE_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    const EYE_OFF_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = EYE_OFF_SVG;
      } else {
        input.type = 'password';
        btn.innerHTML = EYE_SVG;
      }
    }
  </script>
  <script src="login.js"></script>
</body>

</html>
