<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Property - NyumbaHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)),
        url('daniel-barnes-RKdLlTyjm5g-unsplash.jpg') center/cover no-repeat fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.8);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffb400;
    }

    .navbar nav a {
      color: #fff;
      text-decoration: none;
      margin-left: 1.5rem;
      transition: color 0.3s;
    }

    .navbar nav a:hover {
      color: #ffb400;
    }

    .container {
      max-width: 600px;
      margin: 6rem auto 2rem;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #ffb400;
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: #ccc;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 1rem;
      transition: 0.3s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 10px #ffb400;
      outline: none;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, #ffb400, #ffd76a);
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 180, 0, 0.5);
    }

    .not-landlord {
      text-align: center;
      padding: 2rem;
    }

    .not-landlord a {
      color: #ffb400;
      text-decoration: none;
      font-weight: bold;
    }

    .not-logged-in {
      text-align: center;
      padding: 2rem;
    }

    .not-logged-in a {
      color: #ffb400;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="logo">NyumbaHub</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h1>Add New Property</h1>
    
    <div id="propertyForm">
      <div class="not-logged-in">
        <p>You must be logged in to add a property.</p>
        <p><a href="login.html">Login here</a></p>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const propertyForm = document.getElementById('propertyForm');
      
      if (isAuthenticated()) {
        const userData = getUserData();
        
        if (userData && userData.role === 'landlord') {
          propertyForm.innerHTML = `
            <form id="addPropertyForm">
              <div class="form-group">
                <label for="title">Property Title</label>
                <input type="text" id="title" name="title" required placeholder="e.g., Modern Apartment in Nairobi" />
              </div>

              <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" required placeholder="Describe your property..."></textarea>
              </div>

              <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" required placeholder="e.g., Nairobi, Westlands" />
              </div>

              <div class="form-group">
                <label for="rent_amount">Rent Amount (KES)</label>
                <input type="number" id="rent_amount" name="rent_amount" required placeholder="e.g., 25000" />
              </div>

              <div class="form-group">
                <label for="bedrooms">Bedrooms</label>
                <input type="number" id="bedrooms" name="bedrooms" required min="1" value="1" />
              </div>

              <div class="form-group">
                <label for="bathrooms">Bathrooms</label>
                <input type="number" id="bathrooms" name="bathrooms" required min="1" value="1" />
              </div>

              <div class="form-group">
                <label for="property_type">Property Type</label>
                <select id="property_type" name="property_type" required>
                  <option value="apartment">Apartment</option>
                  <option value="house">House</option>
                  <option value="studio">Studio</option>
                  <option value="townhouse">Townhouse</option>
                  <option value="villa">Villa</option>
                </select>
              </div>

              <div class="form-group">
                <label for="available">Available</label>
                <select id="available" name="available" required>
                  <option value="true">Yes</option>
                  <option value="false">No</option>
                </select>
              </div>

              <button type="submit">Add Property</button>
            </form>
          `;

          document.getElementById('addPropertyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const token = getToken();
            const formData = {
              title: document.getElementById('title').value,
              description: document.getElementById('description').value,
              location: document.getElementById('location').value,
              rent_amount: parseFloat(document.getElementById('rent_amount').value),
              bedrooms: parseInt(document.getElementById('bedrooms').value),
              bathrooms: parseInt(document.getElementById('bathrooms').value),
              property_type: document.getElementById('property_type').value,
              available: document.getElementById('available').value === 'true'
            };

            try {
              const response = await fetch('http://localhost:8000/api/properties/', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(formData)
              });

              const data = await response.json();

              if (response.ok) {
                alert('Property added successfully!');
                window.location.href = 'index.html';
              } else {
                alert(`Failed to add property: ${JSON.stringify(data)}`);
              }
            } catch (error) {
              console.error('Error:', error);
              alert('Failed to add property. Please try again.');
            }
          });
        } else {
          propertyForm.innerHTML = `
            <div class="not-landlord">
              <p>Only landlords can add properties.</p>
              <p><a href="index.html">Go back to home</a></p>
            </div>
          `;
        }
      }
    });
  </script>
</body>

</html>
