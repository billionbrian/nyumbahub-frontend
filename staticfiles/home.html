<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapIn</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="styles/global-ui.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg-primary);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-top: 5rem;
        }
    </style>
</head>

<body hx-ext="head-support">
    <div id="navbar"></div>

    <div id="content-swap" class="content-swap" data-page="home" hx-target="#content-swap" hx-select="#content-swap" hx-swap="outerHTML show:window:top" hx-push-url="true">
    <main>
    <h1>Welcome to TapIn</h1>
    </main>
    </div>

    <div id="footer"></div>

    <script src="js/htmx.min.js"></script>
    <script src="js/head-support.js"></script>
    <script src="js/layout.js"></script>
    <script src="theme.js"></script>
    <script src="auth.js"></script>
</body>

</html>
